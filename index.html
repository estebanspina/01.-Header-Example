<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Blog Header</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header wp-block-group" data-site-header>
    <div class="site-header__inner">
      <a class="site-header__logo wp-block-site-title" href="/" aria-label="Home">
        <span>Logo</span>
      </a>

      <nav class="site-header__nav wp-block-navigation" aria-label="Primary navigation" data-primary-nav>
        <ul class="site-header__menu wp-block-navigation__container">
          <li class="wp-block-navigation-item">
            <a class="wp-block-navigation-item__content" href="/">Home</a>
          </li>
          <li class="wp-block-navigation-item">
            <a class="wp-block-navigation-item__content" href="/news/">News</a>
          </li>
          <li class="wp-block-navigation-item">
            <a class="wp-block-navigation-item__content" href="/culture/">Culture</a>
          </li>
          <li class="wp-block-navigation-item site-header__has-submenu">
            <button class="site-header__submenu-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="sections-submenu">
              <span>Sections</span>
              <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16">
                <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <ul id="sections-submenu" class="site-header__submenu">
              <li><a href="/sections/opinion/">Opinion</a></li>
              <li><a href="/sections/interviews/">Interviews</a></li>
              <li><a href="/sections/features/">Features</a></li>
            </ul>
          </li>
        </ul>
      </nav>

      <div class="site-header__actions wp-block-buttons">
        <div class="wp-block-button">
          <a class="wp-block-button__link site-header__subscribe" href="/subscribe/">Subscribe</a>
        </div>

        <button class="site-header__menu-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="mobile-navigation"
                aria-label="Open navigation"
                data-menu-toggle>
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>

    <div id="mobile-navigation" class="site-header__mobile-panel" data-mobile-panel hidden>
      <nav aria-label="Mobile navigation">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/news/">News</a></li>
          <li><a href="/culture/">Culture</a></li>
          <li>
            <button type="button"
                    class="site-header__mobile-submenu-toggle"
                    aria-expanded="false"
                    aria-controls="mobile-sections-submenu"
                    data-mobile-submenu-toggle>
              <span>Sections</span>
              <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16">
                <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <ul id="mobile-sections-submenu" class="site-header__mobile-submenu" hidden>
              <li><a href="/sections/opinion/">Opinion</a></li>
              <li><a href="/sections/interviews/">Interviews</a></li>
              <li><a href="/sections/features/">Features</a></li>
            </ul>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="demo-surface" aria-hidden="true"></main>

  <script src="script.js"></script>
</body>
</html>
